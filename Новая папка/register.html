<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <div class="register-box">
    <h1>Регистрация</h1>
    <form>
      <input type="text" placeholder="Имя" />
      <input type="email" placeholder="Почта" />
      <input type="password" placeholder="Пароль" />
      <input type="text" placeholder="Код класса" />

      <div class="role-buttons">
        <button type="button" class="student-btn">Ученик</button>
        <button type="button" class="teacher-btn">Учитель</button>
      </div>

      <div class="checkbox-container">
        <input type="checkbox" id="agreement" />
        <label for="agreement">Согласен на обработку данных и условия пользования приложением</label>
      </div>

      <button type="submit" class="login-btn">Авторизоваться</button>
    </form>
  </div>
</body>
</html>
