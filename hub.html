<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лайоут с меню</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <div class="layout">
    
    <aside class="sidebar">
      <div class="logo">Класс</div>

      <nav>
        <ul>
          <li><a href="#">Главная</a></li>
          <li><a href="#">Курсы</a></li>
          <li><a href="#">Профиль</a></li>
          <li><a href="#">Настройки</a></li>
        </ul>
      </nav>
    </aside>

    <div class="mobile-nav">
      <a href="#"><img src="svg/programming-script-1--language-programming-code.svg" alt="Задания"></a>
      <a href="#"><img src="svg/image-photo-four--photos-camera-picture-photography-pictures-four-photo.svg" alt="Курсы"></a>
      <a href="#"><img src="svg/interface-user-circle--circle-geometric-human-person-single-user.svg" alt="Профиль"></a>
      <a href="#"><img src="svg/interface-setting-cog--work-loading-cog-gear-settings-machine.svg" alt="Настройки"></a>
    </div>

    <main class="content">
  
      <div class="header">
        <img src="avatar.png" alt="Аватар" class="avatar">
        <h1>Привет, Тигр</h1>
      </div>
    
      <div class="recent">
        <h2>Недавние...</h2>
    
        <div class="recent-item">
          <div class="subject-avatar">A</div>
    
          <div class="recent-text-block">
            <h3>Русский язык</h3>
            <p>Название теста.<br>ЖИ ШИ пиши с буквой и. Часть 1</p>
            <span class="status">Статус: срочно или не решён</span>
          </div>
        </div>
      </div>
    
      <div class="courses">
        <h2>Все курсы</h2>
      
        <div class="courses-grid">
          
          <div class="course-card">
            <div class="course-avatar" style="background: #9d7dfc;">
              <div class="course-letter">Р</div>
              <div class="course-name">Русский</div>
            </div>
          </div>
      
          <div class="course-card">
            <div class="course-avatar" style="background: #f48fb1;">
              <div class="course-letter">М</div>
              <div class="course-name">Математика</div>
            </div>
          </div>
      
          <div class="course-card">
            <div class="course-avatar" style="background: #81d4fa;">
              <div class="course-letter">И</div>
              <div class="course-name">История</div>
            </div>
          </div>
      
          <div class="course-card">
            <div class="course-avatar" style="background: #7986cb;">
              <div class="course-letter">Б</div>
              <div class="course-name">Биология</div>
            </div>
          </div>
      
          <div class="course-card">
            <div class="course-avatar" style="background: #c5e1a5;">
              <div class="course-letter">Ф</div>
              <div class="course-name">Физика</div>
            </div>
          </div>
      
          <div class="course-card">
            <div class="course-avatar" style="background: #ef9a9a;">
              <div class="course-letter">Х</div>
              <div class="course-name">Химия</div>
            </div>
          </div>
      
          <div class="course-card">
            <div class="course-avatar" style="background: #ce93d8;">
              <div class="course-letter">Г</div>
              <div class="course-name">География</div>
            </div>
          </div>
      
          <div class="course-card">
            <div class="course-avatar" style="background: #81c784;">
              <div class="course-letter">А</div>
              <div class="course-name">Английский</div>
            </div>
          </div>
      
        </div>
      </div>
      
      
    
    </main>
 
    

  </div>

</body>
</html>
